# nginx как reverse proxy для Next.js standalone (app:3000).
#
# Что делает nginx:
#   - терминирует HTTP на :80 хоста,
#   - проксирует запросы на app:3000,
#   - кеширует /_next/static/* immutable на год (статика с хешами),
#   - отдаёт /uploads/* напрямую с volume (чтобы не дёргать Node под каждую картинку),
#   - вешает security-заголовки.
#
# CSP здесь намеренно мягкий (script-src 'unsafe-inline' для Next/inline runtime).
# Это компромисс ради скорости запуска админки. После стабилизации можно ужесточить
# с nonce через middleware.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    # ---- Сжатие ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Security headers (общие для всех ответов) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Картинки из админки: отдаём напрямую с volume ----
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Статика Next.js (immutable, год) ----
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Healthcheck nginx ----
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- Всё остальное — на Next ----
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Запрет dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
