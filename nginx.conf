# Конфиг nginx для статической сборки Next.js (output: 'export').
# Все security-заголовки и кеш-политики из промта живут здесь — middleware Next.js
# в режиме статического экспорта не работает.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip + Brotli (если модуль доступен)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Security headers (общие для всех ответов) ----
    # CSP — без unsafe-inline / unsafe-eval в prod. Исключение для /emulator
    # описано ниже отдельным location-блоком.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- Эмулятор: страница исполняет JS-шаблоны пользователя в sandboxed iframe.
    # Тут разрешён wasm-unsafe-eval (для Shiki/виртуальной машины JS),
    # но сам iframe-песочница имеет sandbox="allow-scripts" без allow-same-origin.
    location ^~ /emulator {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        try_files $uri $uri/ $uri.html /emulator/index.html;
    }

    # ---- Кеширование ----
    # Статика с хешем в имени (_next/static/...) — immutable на год
    location ~* ^/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Картинки и шрифты — immutable на год
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Pagefind-индекс — короткий swr
    location /pagefind/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    # HTML — короткий swr (Next.js перерисовывает на каждом билде)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    # ---- Маршрутизация ----
    # Поведение Next.js trailingSlash: true — добавляем / в конце.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 404-страница
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Запрет на доступ к dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Healthcheck (без security-заголовков, чтобы не плодить шум)
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
