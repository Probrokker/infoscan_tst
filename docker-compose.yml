services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infoscan-docs
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      NGINX_HOST: docs.inf-tec.ru
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
